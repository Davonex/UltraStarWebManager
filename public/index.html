<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UltraStarWebManager</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <!--
      Textes : anglais par défaut dans le HTML, remplacés au chargement selon la langue.
      Toute chaîne visible doit avoir un attribut data-i18n* (voir public/js/i18n.js).
    -->
    <nav class="navbar bg-body-tertiary border-bottom sticky-top">
      <div class="container-fluid gap-2 flex-nowrap">
        <span class="navbar-brand me-auto text-truncate" data-i18n="app.title">UltraStarWebManager</span>
        <span id="server-status" class="badge text-bg-secondary">Connecting…</span>
        <select
          id="language-select"
          class="form-select form-select-sm w-auto"
          aria-label="Language"
          data-i18n-aria-label="nav.language"
          data-i18n-title="nav.language"
        ></select>
      </div>
    </nav>

    <main class="container-fluid pt-3">
      <search>
        <form id="filters" class="mb-3">
          <input
            name="q"
            type="search"
            class="form-control form-control-lg rounded-pill mb-2"
            autocomplete="off"
            placeholder="Search artist or title…"
            data-i18n-placeholder="filters.search"
            data-i18n-aria-label="filters.search"
          />

          <!-- Pastilles : chaque facette ouvre la fenêtre de choix (public/js/filtersView.js) -->
          <div class="d-flex flex-wrap gap-2 mb-2">
            <button type="button" class="facet-chip" data-facet="language" aria-pressed="false">
              <span data-i18n="filters.language">Language</span>
              <span class="facet-chip-count badge rounded-pill" hidden></span>
            </button>
            <button type="button" class="facet-chip" data-facet="decade" aria-pressed="false">
              <span data-i18n="filters.decade">Decade</span>
              <span class="facet-chip-count badge rounded-pill" hidden></span>
            </button>
            <button type="button" class="facet-chip" data-facet="genre" aria-pressed="false">
              <span data-i18n="filters.genre">Genre</span>
              <span class="facet-chip-count badge rounded-pill" hidden></span>
            </button>
            <button type="button" class="facet-chip" data-facet="edition" aria-pressed="false">
              <span data-i18n="filters.edition">Edition</span>
              <span class="facet-chip-count badge rounded-pill" hidden></span>
            </button>
            <button type="button" class="facet-chip" data-facet="tag" aria-pressed="false">
              <span data-i18n="filters.tag">Tags</span>
              <span class="facet-chip-count badge rounded-pill" hidden></span>
            </button>
            <button type="button" class="facet-chip" data-action="duet" aria-pressed="false">
              <span data-i18n="filters.duetOnly">Duets</span>
            </button>
            <button type="button" class="facet-chip facet-chip-reset" data-action="reset" hidden>
              ✕ <span data-i18n="filters.reset">Reset</span>
            </button>
          </div>

          <div class="d-flex align-items-center gap-2">
            <select
              name="sort"
              class="form-select form-select-sm w-auto"
              aria-label="Sort by"
              data-i18n-aria-label="filters.sort"
            >
              <option value="artist" data-i18n="filters.sortArtist">Sort: artist</option>
              <option value="title" data-i18n="filters.sortTitle">Sort: title</option>
              <option value="year-desc" data-i18n="filters.sortYearDesc">Sort: newest year</option>
              <option value="year-asc" data-i18n="filters.sortYearAsc">Sort: oldest year</option>
              <option value="recent" data-i18n="filters.sortRecent">Sort: recently modified</option>
            </select>
            <p id="results-count" class="small text-body-secondary mb-0 ms-auto" aria-live="polite"></p>
          </div>
        </form>
      </search>

      <div id="song-grid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 row-cols-xxl-8 g-3"></div>
      <div id="song-grid-sentinel" aria-hidden="true"></div>
    </main>

    <!-- Modèle d'une carte chanson (cloné par public/js/songGrid.js) -->
    <template id="song-card-template">
      <div class="col">
        <article class="card song-card overflow-hidden">
          <div class="position-relative">
            <img class="song-cover d-block w-100" loading="lazy" decoding="async" alt="" />
            <div class="song-badges"></div>
            <button
              type="button"
              class="play-button song-play"
              data-action="preview"
              data-state="play"
              aria-label="Play preview"
            >
              <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z" /></svg>
              <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
              <span class="icon icon-loading spinner-border" aria-hidden="true"></span>
            </button>
            <!-- Artiste et titre en surimpression au bas de la pochette -->
            <div class="song-caption">
              <p class="song-artist text-truncate mb-0"></p>
              <h2 class="song-title text-truncate mb-0">Title</h2>
            </div>
          </div>
        </article>
      </div>
    </template>

    <!-- Fenêtre de choix d'une facette (plein écran sur mobile) -->
    <div
      id="facet-modal"
      class="modal fade"
      role="dialog"
      tabindex="-1"
      aria-labelledby="facet-modal-title"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="facet-modal-title" class="modal-title h5">Filter</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
              data-i18n-aria-label="common.close"
            ></button>
          </div>
          <div class="modal-body">
            <input type="search" class="form-control mb-3" autocomplete="off" hidden />
            <div class="facet-options row row-cols-2 row-cols-sm-3 row-cols-lg-4 g-2"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary me-auto" data-action="clear-facet">
              <span data-i18n="filters.clearFacet">Clear</span>
            </button>
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal" data-action="show-results">
              Show results
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Barre de lecture de la preview (public/js/playerBar.js) -->
    <div id="player-bar" class="fixed-bottom bg-body-tertiary border-top shadow-lg" hidden>
      <div class="container-fluid py-2 d-flex align-items-center gap-3">
        <img class="player-cover rounded" width="48" height="48" alt="" />
        <div class="flex-grow-1 min-w-0">
          <div class="d-flex justify-content-between gap-2">
            <div class="text-truncate">
              <strong class="player-title"></strong>
              <span class="text-body-secondary"> — </span>
              <span class="player-artist text-body-secondary"></span>
            </div>
            <small class="player-status text-body-secondary text-nowrap"></small>
          </div>
          <!-- Curseur de position : clic, glisser, ou flèches du clavier (public/js/playerBar.js) -->
          <div
            class="progress-track"
            role="slider"
            tabindex="0"
            aria-valuemin="0"
            aria-valuemax="0"
            aria-valuenow="0"
            aria-label="Position in the song"
            data-i18n-aria-label="player.progress"
          >
            <div class="progress">
              <div class="progress-preview"></div>
              <div class="progress-bar"></div>
            </div>
          </div>
        </div>
        <button type="button" class="play-button player-button" data-action="toggle" data-state="play">
          <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z" /></svg>
          <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
          <span class="icon icon-loading spinner-border" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="play-button player-button"
          data-action="stop"
          aria-label="Stop"
          data-i18n-aria-label="player.stop"
          data-i18n-title="player.stop"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg>
        </button>
        <input
          name="volume"
          type="range"
          class="form-range player-volume d-none d-md-block"
          min="0"
          max="100"
          aria-label="Volume"
          data-i18n-aria-label="player.volume"
          data-i18n-title="player.volume"
        />
      </div>
    </div>

    <!-- Lecteur unique partagé pour les previews -->
    <!-- biome-ignore lint/a11y/useMediaCaption: extrait musical, pas de dialogue à sous-titrer -->
    <audio id="preview-player" preload="none"></audio>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
